# =============================================================
# 广东紫翔科技企业官网 — nginx 配置（自建服务器场景）
# 撰写：韩渡川（阿客实验室研发部）
# 版本：v1.0 / 2026-10-21
#
# 适用场景：客户使用自有云服务器（非 OSS/CDN）托管纯静态站点。
# 生产推荐方案为阿里云 OSS+CDN，本配置为备选（见 docs/deployment.md §8）。
#
# 部署方式：
#   1. 站点文件放置 /var/www/zixiang-website（5 个 HTML + assets/）
#   2. 证书放置 /etc/nginx/ssl/（见下方 ssl_certificate 路径，按实际修改）
#   3. 本文件放入 /etc/nginx/conf.d/zixiang.conf
#   4. 检查并重载：sudo nginx -t && sudo systemctl reload nginx
#
# 说明：站点为零外部依赖纯静态站，无 PHP、无数据库、无反向代理需求。
# =============================================================

# ---- HTTP：一律 301 跳转 HTTPS ----
server {
    listen 80;
    listen [::]:80;
    server_name zixiang.com www.zixiang.com;

    # ACME 证书签发如需临时放行，取消下面两行注释
    # location /.well-known/acme-challenge/ {
    #     root /var/www/zixiang-website;
    # }

    return 301 https://$host$request_uri;
}

# ---- HTTPS 主站 ----
server {
    listen 443 ssl http2;   # nginx >= 1.25.1 可改为 "listen 443 ssl;" + "http2 on;"
    listen [::]:443 ssl http2;
    server_name zixiang.com www.zixiang.com;

    root /var/www/zixiang-website;
    index index.html;

    # ---- 证书（certbot 或阿里云证书下载后放置；路径按实际修改）----
    ssl_certificate     /etc/nginx/ssl/zixiang.com.fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/zixiang.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ---- 基础 ----
    server_tokens off;
    charset utf-8;

    # ---- MIME 类型：保证 SVG / favicon 正确 ----
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    types {
        image/svg+xml svg svgz;
    }

    # ---- gzip 压缩（文本类资源收益最大；SVG 压缩后收益明显）----
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml text/javascript
               application/javascript application/x-javascript
               application/json application/xml application/rss+xml
               image/svg+xml;

    # ---- 安全响应头 ----
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # 零外部依赖静态站可收紧 CSP；页面 head 含内联脚本（has-js 标记）与个别内联
    # style 属性，需保留 'unsafe-inline'；后续若接入外部表单接口，需同步调整 form-action
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self' mailto:; base-uri 'self'; frame-ancestors 'self'" always;

    # ---- 日志 ----
    access_log /var/log/nginx/zixiang.access.log;
    error_log  /var/log/nginx/zixiang.error.log warn;

    # ---- HTML：短缓存 5 分钟（内容可能随时更新）----
    location ~* \.html$ {
        add_header Cache-Control "public, max-age=300";
        try_files $uri =404;
    }

    # ---- 静态资源：长缓存 1 年 + immutable ----
    # 注意：本项目无构建、文件名固定（style.css / main.js / favicon.svg 等），
    # 覆盖更新后浏览器/代理可能长期持旧文件，详见 docs/deployment.md §6.1
    location ~* \.(?:css|js|mjs|svg|svgz|png|jpe?g|gif|webp|avif|ico|woff2?|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ---- 站点根路由：/about → /about.html ----
    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }

    # 隐藏文件一律拒绝
    location ~ /\. {
        deny all;
    }

    # 站点 favicon 为 assets/img/favicon.svg，根目录无 favicon.ico，静默处理
    location = /favicon.ico {
        access_log off;
        log_not_found off;
        return 204;
    }

    # 错误页（404.html 已由前端补充，位于站点根目录）
    error_page 404 /404.html;
}
