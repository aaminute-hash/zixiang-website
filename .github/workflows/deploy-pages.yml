# =============================================================
# 广东紫翔科技企业官网 — GitHub Pages 自动部署
# 撰写：韩渡川（阿客实验室研发部）
# 版本：v1.0 / 2026-10-21
#
# 触发：push 到 main 分支，或在 Actions 页面手动 workflow_dispatch
# 作用：组装静态站点产物（5 个页面 + 404.html + assets/）并部署到 GitHub Pages
# 预览地址：https://aaminute-hash.github.io/zixiang-website/
#
# 一次性前置设置（仓库管理员操作，GITHUB_TOKEN 无权代劳，二选一）：
#   a) 仓库页面 → Settings → Pages → Build and deployment → Source: 选 "GitHub Actions"
#   b) 或带 repo scope 的 PAT 调 API：
#      curl -X POST https://api.github.com/repos/aaminute-hash/zixiang-website/pages \
#        -H "Authorization: token <PAT>" -d '{"build_type":"workflow"}'
#   （不要选 "Deploy from a branch"，否则与本 workflow 的 pages 部署相互冲突；
#     configure-pages 的 enablement: true 无法突破"集成令牌无权创建 Pages 站点"的
#     平台限制，会报 Create Pages site failed: Resource not accessible by integration，
#     2026-10-21 实测）
#
# 定位说明：GitHub Pages 用作预览/演示/验收环境（Phase 4 验收）；
#          正式生产环境为阿里云 OSS+CDN，OSS 自动发布为进阶选项，
#          详见 docs/deployment.md §2、§10.3、§10.5。
#
# 文件关系：本文件为活跃副本，母本位于 deploy/github-actions.yml，请勿直接编辑本文件；
#          变更流程：修改 deploy/github-actions.yml → 同步覆盖本文件 → push
#          （GitHub 仅从 .github/workflows/ 目录读取工作流，deploy/ 下的不会触发）。
# =============================================================
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 权限最小化：仅 Pages 部署所需
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个 Pages 部署；新推送取消进行中的旧部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout 仓库
        uses: actions/checkout@v4

      - name: 组装静态站点产物
        run: |
          mkdir -p dist
          cp index.html about.html industries.html cooperation.html contact.html 404.html dist/
          cp -r assets dist/
          # 自检：5 个页面 + 404 页与关键资源必须齐全，缺失即使流水线失败
          test -f dist/index.html && test -f dist/about.html && test -f dist/industries.html \
            && test -f dist/cooperation.html && test -f dist/contact.html && test -f dist/404.html \
            && test -f dist/assets/css/style.css && test -f dist/assets/js/main.js \
            && test -d dist/assets/img
          echo "站点产物清单："
          find dist -type f | sort

      - name: 配置 Pages
        uses: actions/configure-pages@v5
        with:
          # enablement: true —— 仓库未启用 Pages 时由本步骤自动以 GitHub Actions 模式启用。
          # 该参数默认为 false；缺失时首次运行会报
          # "Get Pages site failed ... Error: Not Found"（2026-10-21 首次运行实测）。
          enablement: true

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
